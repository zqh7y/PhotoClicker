name: Build PhotoClicker.exe

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write  # to publish the .exe as a release download

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Test matching
        run: python -m pytest -q

      - name: Drop parts the app never uses (keeps the .exe small)
        shell: pwsh
        run: |
          # OpenCV's video/ffmpeg library is ~25 MB and only needed for video files
          $cv2 = python -c "import cv2, os; print(os.path.dirname(cv2.__file__))"
          Get-ChildItem $cv2 -Filter "opencv_videoio_ffmpeg*.dll" | Remove-Item -Verbose

      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PhotoClicker
          --icon assets/icon.png
          --add-data "assets;assets"
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --exclude-module PIL
          --exclude-module pyscreeze
          gui.py

      - name: Show .exe size
        shell: pwsh
        run: '"{0:N1} MB" -f ((Get-Item dist\PhotoClicker.exe).Length / 1MB)'

      - name: Check the .exe starts
        shell: pwsh
        run: |
          $env:SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process dist\PhotoClicker.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Photo Clicker
          body: |
            Download **PhotoClicker.exe** below and open it.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.
            How to use: see the README on the main page.
          files: dist/PhotoClicker.exe
          make_latest: true
